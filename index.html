<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Chuberka - Digital Business Card</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #222222;
            --subtext-color: #555555;
            --primary-btn: #0066cc;
            --secondary-btn: #28a745;
            --email-btn: #007aff;
            --email-btn-text: #ffffff;
            --outline-btn: #f0f0f5;
            --outline-btn-text: #222222;
            --outline-border: rgba(0,0,0,0.08);
        }

        /* Automatic Dark Mode Styles */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #ffffff;
                --subtext-color: #bbbbbb;
                --primary-btn: #0a84ff;
                --secondary-btn: #30d158;
                --email-btn: #f5a623;
                --email-btn-text: #ffffff;
                --outline-btn: #2c2c2e;
                --outline-btn-text: #ffffff;
                --outline-border: rgba(255,255,255,0.12);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            background-color: #ddd;
        }

        h1 { margin: 8px 0 4px; font-size: 22px; }
        
        /* Updated p.title with bold font weight */
        p.title { 
            color: var(--subtext-color); 
            margin: 0 0 6px; 
            font-size: 14px; 
            font-weight: 700; 
        }

        p.bio { color: var(--subtext-color); margin: 0 0 20px; font-size: 13px; line-height: 1.4; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-sizing: border-box;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .btn:hover { opacity: 0.88; }

        .btn-primary { background: var(--primary-btn); color: #ffffff; }
        .btn-success { background: var(--secondary-btn); color: #ffffff; }
        .btn-email { background: var(--email-btn); color: var(--email-btn-text); }
        .btn-outline { 
            background: var(--outline-btn); 
            color: var(--outline-btn-text); 
            border: 1px solid var(--outline-border); 
        }
    </style>
</head>
